version: "3.9"

# Development override — mirrors prod with hot-reload and debug enabled.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    build:
      context: .
      target: builder       # Use builder stage with all dev deps installed
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DEBUG=True
    volumes:
      - .:/app                   # Live code reload
      - tile_data:/app/data/tiles
      - scan_data:/app/data/scans
      - mrms_data:/app/data/mrms
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      target: builder
    command: celery -A config worker -l DEBUG --concurrency 2
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
      - tile_data:/app/data/tiles
      - scan_data:/app/data/scans
      - mrms_data:/app/data/mrms
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
      target: builder
    command: celery -A config beat -l DEBUG --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
