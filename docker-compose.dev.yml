version: "3.9"

# Development infrastructure — run Django locally via VSCode (launch.json).
# Provides only backing services: db, Redis, and optional Celery worker/beat.
#
# Start just the infrastructure:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up db redis
#
# Then launch Django from VSCode: Run > Django: Debug Server

services:
  worker:
    build:
      context: .
      target: builder
    command: celery -A config worker -l DEBUG --concurrency 2
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
      - tile_data:/app/data/tiles
      - scan_data:/app/data/scans
      - mrms_data:/app/data/mrms
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
      target: builder
    command: celery -A config beat -l DEBUG --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
